<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">

    <title>Form Exercise</title>
</head>
<body>
  
        <form class="card m-5" >
            <h5 class="card-header">Payment form example</h5>
            <div class="card-body">
                <div class="alert alert-danger mb-3" role="alert">
                    Some fields are missing
                </div>
                <div class="row">
                    <div class="col-lg-5 col-md-12 mb-3">
                        <label for="exampleFormControlInput1" class="form-label">Card#</label>
                        <input type="password" class="form-control" id="exampleFormControlInput1" placeholder="XXXXXXXXXXXXXXXXXXX">
                      </div>
                      <div class="col-lg-2 col-md-6 mb-3">
                        <label for="exampleFormControlInput2" class="form-label">CVC</label>
                        <input type="email" class="form-control" id="exampleFormControlInput2" placeholder="0000">
                      </div>
                      <div class="col-lg-5 col-md-6 mb-3">
                        <label for="exampleFormControlInput3" class="form-label">Amount</label>
                        <input type="email" class="form-control" id="exampleFormControlInput3" placeholder="Amount">
                      </div>
                </div>

                <div class="row">
                    <div class="col-lg-6 col-md-12 mb-3">
                        <label for="exampleFormControlInput4" class="form-label">First Name</label>
                        <input type="email" class="form-control" id="exampleFormControlInput4" placeholder="">
                      </div>
                      <div class="col-lg-6 col-md-12 mb-3">
                        <label for="exampleFormControlInput5" class="form-label">Last Name</label>
                        <input type="email" class="form-control" id="exampleFormControlInput5" placeholder="">
                      </div>
                </div>

                <div class="row">
                    <div class="col-lg-6 col-md-12 mb-3">
                        <label for="exampleFormControlInput1" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="name@example.com">
                      </div>
                      <div class="col-lg-3 col-md-6 mb-3">
                        <label for="exampleFormControlInput1" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="name@example.com">
                      </div>
                      <div class="col-lg-3 col-md-6 mb-3">
                        <label for="exampleFormControlInput1" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="name@example.com">
                      </div>
                </div>

                <div class="row">
                    
                    <div class="col-lg-6 col-md-12 mb-3">
                        <label for="exampleFormControlInput1" class="form-label">Email address</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio1" value="option1">
                            <label class="form-check-label" for="inlineRadio1">1</label>
                          </div>
                          <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio2" value="option2">
                            <label class="form-check-label" for="inlineRadio2">2</label>
                          </div>
                          <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio3" value="option3" disabled>
                            <label class="form-check-label" for="inlineRadio3">3 (disabled)</label>
                      </div>
                      <div class="col-lg-6 col-md-12 mb-3">
                        <label for="exampleFormControlInput1" class="form-label">Message</label>
                        <input type="form-control" class="form-control" id="exampleFormControlInput1" placeholder="name@example.com">
                      </div>
                </div>
              
                
                </div>
             
            </div>
            <div class="d-grid gap-2 d-md-flex justify-content-md-end card-footer">
                <button class="btn btn-secondary me-md-2" type="button">Cancel</button>
                <button class="btn btn-primary" type="button">Send</button>
              </div>
        </form>
        

   




</div>






<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>  
</body>
</html>
