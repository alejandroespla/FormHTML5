<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">

    <title>Form Exercise</title>
</head>
<body>
  
        <form class="card m-auto mt-5" >
            <h5 class="card-header">Payment form example</h5>
            <div class="card-body">
                <div class="alert alert-danger mb-4" role="alert">
                    Some fields are missing
                </div>
                <div class="row">
                    <div class="col-lg-5 col-md-12 mb-3">
                        <label for="exampleFormControlInput1" class="form-label">Card#</label>
                        <input type="password" class="form-control" id="exampleFormControlInput1" placeholder="XXXXXXXXXXXXXXXXXXX">
                      </div>
                      <div class="col-lg-2 col-md-6 mb-3">
                        <label for="exampleFormControlInput2" class="form-label">CVC</label>
                        <input type="email" class="form-control" id="exampleFormControlInput2" placeholder="0000">
                      </div>
                      <div class="col-lg-5 col-md-6 mb-3">
                        <label for="exampleFormControlInput3" class="form-label">Amount</label>
                        <input type="email" class="form-control" id="exampleFormControlInput3" placeholder="Amount">
                      </div>
                </div>

                <div class="row">
                    <div class="col-lg-6 col-md-12 mb-3">
                        <label for="exampleFormControlInput4" class="form-label">First Name</label>
                        <input type="text" class="form-control" id="exampleFormControlInput4" placeholder="">
                      </div>
                      <div class="col-lg-6 col-md-12 mb-3">
                        <label for="exampleFormControlInput5" class="form-label">Last Name</label>
                        <input type="text" class="form-control" id="exampleFormControlInput5" placeholder="">
                      </div>
                </div>

                <div class="row">
                    <div class="col-lg-6 col-md-12 mb-3">
                        <label for="exampleFormControlInput6" class="form-label">City</label>
                        <input type="text" class="form-control" id="exampleFormControlInput6" placeholder="">
                      </div>
                      <div class="col-lg-3 col-md-6 mb-3">
                        <label for="exampleFormControlInput7" class="form-label">State</label>
                        <select class="form-select form-select-md" aria-label="Large select example">
                          <option selected></option>
                          <option value="1">Murcia</option>
                          <option value="2">Alicante</option>
                          <option value="3">Madrid</option>
                        </select>
                      </div>
                      
                      <div class="col-lg-3 col-md-6 mb-3">
                        <label for="exampleFormControlInput8" class="form-label">Postal Code</label>
                        <input type="number" class="form-control" id="exampleFormControlInput8" placeholder="">
                      </div>
                </div>

                <div class="row">
                    
                    <div class="col-lg-6 col-md-12 mb-3">
                        <label for="exampleFormControlInput1" class="form-label mb-3">We accept</label>
                        <div class="bg-secondary d-flex p-2 adjustcontent">
                          <div class="form-check me-3">
                            <input class="form-check-input" type="radio" name="exampleRadios" id="exampleRadios1" value="option1" checked>
                            <label class="form-check-label" for="exampleRadios1">
                              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-credit-card-fill" viewBox="0 0 16 16">
                                <path d="M0 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v1H0zm0 3v5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7zm3 2h1a1 1 0 0 1 1 1v1a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1v-1a1 1 0 0 1 1-1"/>
                              </svg>
                            </label>
                          </div>
                          <div class="form-check me-3">
                            <input class="form-check-input" type="radio" name="exampleRadios" id="exampleRadios2" value="option2">
                            <label class="form-check-label" for="exampleRadios2">
                              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-credit-card-fill" viewBox="0 0 16 16">
                                <path d="M0 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v1H0zm0 3v5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7zm3 2h1a1 1 0 0 1 1 1v1a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1v-1a1 1 0 0 1 1-1"/>
                              </svg>
                            </label>
                          </div>
                          <div class="form-check me-3">
                            <input class="form-check-input" type="radio" name="exampleRadios" id="exampleRadios3" value="option3" disabled>
                            <label class="form-check-label" for="exampleRadios3">
                              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-credit-card-fill" viewBox="0 0 16 16">
                                <path d="M0 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v1H0zm0 3v5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7zm3 2h1a1 1 0 0 1 1 1v1a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1v-1a1 1 0 0 1 1-1"/>
                              </svg>
                            </label>
                          </div>
                          <div class="form-check">
                            <input class="form-check-input" type="radio" name="exampleRadios" id="exampleRadios3" value="option3" disabled>
                            <label class="form-check-label" for="exampleRadios3">
                              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-credit-card-fill" viewBox="0 0 16 16">
                                <path d="M0 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v1H0zm0 3v5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7zm3 2h1a1 1 0 0 1 1 1v1a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1v-1a1 1 0 0 1 1-1"/>
                              </svg>
                            </label>
                          </div>
                        </div>
                  
                      </div>  
                      <div class="col-lg-6 col-md-12 mb-3">
                        <label for="exampleFormControlInput1" class="form-label">Message</label>
                        <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="">
                        <p class="text-secondary">Add any notes here</p>
                      </div>
                </div>
              
                
                </div>
             
            </div>
            <div class="d-grid gap-2 d-md-flex justify-content-md-end card-footer">
                <button class="btn btn-secondary me-md-2" type="button">Cancel</button>
                <button class="btn btn-primary" type="button">Send</button>
              </div>
        </form>
        

   




</div>






<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>  
</body>
</html>
